apiVersion: apps/v1
kind: Deployment
metadata:
  name: middle-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: middle-app
  template:
    metadata:
      labels:
        app: middle-app
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z middle-postgres 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: app
          image: middle:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: middle-config
            - secretRef:
                name: middle-secret
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: middle-app
spec:
  type: NodePort
  selector:
    app: middle-app
  ports:
    - port: 8080
      targetPort: 8080
