spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/remitcore}
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
  flyway:
    enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

middle:
  observability:
    header-name: X-Correlation-Id
    logging:
      enabled: true
      ignored-paths:
        - /actuator/**
    idempotency:
      enabled: true
