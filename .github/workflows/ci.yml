name: CI/CD
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile, no tests)
        run: ./gradlew assemble

      - name: Test
        run: ./gradlew test

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'

  image:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          IMAGE_LC="${IMAGE,,}"                 
          echo "sha_tag=${IMAGE_LC}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_LC}:latest"        >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: minikube
        uses: medyagh/setup-minikube@latest
      - name: Load image into cluster
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.image.outputs.image-ref }}
          minikube image load ${{ needs.image.outputs.image-ref }}

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/middle-app app=${{ needs.image.outputs.image-ref }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/middle-postgres --timeout=120s
          kubectl rollout status deployment/middle-app --timeout=240s
          kubectl get pods -o wide

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deployment/middle-app
          kubectl describe pods -l app=middle-app
          kubectl logs -l app=middle-app --all-containers --tail=300 || true
          kubectl get events --sort-by=.lastTimestamp | tail -50
